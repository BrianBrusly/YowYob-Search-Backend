# Configuration commune YowYob Search Platform
# Module: yowyob-common-service
# Java 21 | Spring Boot 3.4.x
#
# @author YowYob Team 4GI-ENSPY Promo 2027
# @author HEUDEP DJANDJA BRIAN B 22P405
# @version 1.0.0

spring:
  application:
    name: yowyob-common

  jackson:
    date-format: yyyy-MM-dd'T'HH:mm:ss.SSS'Z'
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
      indent-output: false
    deserialization:
      fail-on-unknown-properties: false
      adjust-dates-to-context-time-zone: false
    default-property-inclusion: non_null

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
      file-size-threshold: 2KB

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  
  level:
    root: INFO
    com.yowyob: DEBUG
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.hibernate: WARN
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

app:
  name: YowYob Search Platform
  version: 1.0.0
  description: Plateforme de recherche intelligente distribuée
  
  security:
    jwt:
      expiration-ms: 900000
      refresh-expiration-ms: 604800000
      issuer: yowyob-search
      audience: yowyob-clients
    
    password:
      min-length: 8
      require-uppercase: true
      require-lowercase: true
      require-digit: true
      require-special-char: true
      bcrypt-rounds: 12
    
    cors:
      allowed-origins:
        - http://localhost:3000
        - http://localhost:8080
      allowed-methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      allowed-headers: "*"
      allow-credentials: true
      max-age: 3600
  
  cache:
    redis:
      ttl:
        search: 300
        user: 1800
        geo: 86400
      key-prefix: "yowyob:"
  
  rate-limiting:
    enabled: true
    requests-per-minute: 100
    burst-capacity: 20

  validation:
    email:
      check-dns: false
      blacklist-enabled: true
    phone:
      default-country: CM
      strict: false
  
  file:
    storage:
      type: local
      local-path: ./uploads
      max-size: 10485760
    allowed-types:
      - image/jpeg
      - image/png
      - image/gif
      - application/pdf
      - text/plain

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true